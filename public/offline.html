<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#fbf8f2">
    <title>Offline — Bhajan Planner</title>
    <link rel="manifest" href="/manifest.json">
    <link rel="icon" href="/images/icons/icon-192x192.png">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #fbf8f2;
            color: #221e2a;
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px;
            text-align: center;
        }

        .offline-container {
            max-width: 400px;
            animation: fadeUp 0.6s ease both;
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(18px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .offline-signal {
            width: 80px;
            height: 80px;
            margin: 0 auto 28px;
            background: linear-gradient(135deg, #e7e0d2 0%, #f4f0e8 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.25rem;
        }

        .offline-logo {
            width: 72px;
            height: 72px;
            border-radius: 16px;
            margin: 0 auto 28px;
            object-fit: contain;
        }

        h1 {
            font-family: 'Fraunces', Georgia, 'Times New Roman', serif;
            font-size: 1.65rem;
            font-weight: 600;
            margin-bottom: 10px;
            color: #221e2a;
        }

        p {
            font-size: 0.95rem;
            color: #4a4456;
            line-height: 1.65;
            margin-bottom: 32px;
        }

        .retry-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 13px 32px;
            background: linear-gradient(135deg, #D98A2B, #B86F1E);
            color: #fff;
            border: none;
            border-radius: 12px;
            font-size: 0.95rem;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            text-decoration: none;
            box-shadow: 0 4px 14px rgba(217, 138, 43, 0.28);
            transition: transform 0.15s, box-shadow 0.2s;
        }
        .retry-btn:hover  { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(217, 138, 43, 0.38); }
        .retry-btn:active { transform: translateY(0);    box-shadow: 0 2px 8px  rgba(217, 138, 43, 0.2); }

        .hint {
            margin-top: 24px;
            font-size: 0.8rem;
            color: #8b8394;
        }
    </style>
</head>
<body>
    <div class="offline-container">
        <div class="offline-signal">📡</div>
        <img class="offline-logo" src="/images/icons/icon-192x192.png" alt="Bhajan Planner">
        <h1>You're Offline</h1>
        <p>It looks like your internet connection is unavailable right now. Please check your connection and try again.</p>
        <button class="retry-btn" onclick="window.location.reload()">
            ↻ Try Again
        </button>
        <p class="hint">Sai Ram 🙏</p>
    </div>
</body>
</html>
